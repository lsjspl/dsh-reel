<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>媒体库 · dsh-reel</title>
<link rel="stylesheet" href="/reel/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f7cff'/><path d='M11 10.5v11l9-5.5z' fill='white'/></svg>">
</head>
<body data-mode="browse" data-view="grid">

<!-- ── 顶栏 ───────────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">媒体库</span>
  </div>

  <div class="modes" role="tablist" aria-label="浏览模式">
    <button type="button" class="mode-btn is-active" data-mode-btn="browse" role="tab" aria-selected="true">列表模式</button>
    <button type="button" class="mode-btn" data-mode-btn="feed" role="tab" aria-selected="false">刷视频</button>
  </div>

  <div class="search">
    <input id="searchInput" type="search" placeholder="筛选当前目录（名称）" autocomplete="off" spellcheck="false" aria-label="筛选">
    <kbd class="search-hint">/</kbd>
  </div>

  <div class="topbar-actions">
    <button type="button" class="icon-btn" id="viewToggle" title="切换网格 / 列表 (V)" aria-label="切换视图">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z"/></svg>
    </button>
    <button type="button" class="icon-btn" id="sortToggle" title="切换排序 (S)" aria-label="切换排序">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12v2H4zM4 9h8v2H4zM4 13h5v2H4z"/></svg>
    </button>
    <button type="button" class="icon-btn" id="refreshBtn" title="重新载入当前目录 (R)" aria-label="刷新">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 6.7 9h-2.1A5 5 0 1 1 10 5v2.5L14 4l-4-3.5z"/></svg>
    </button>
    <button type="button" class="icon-btn" id="settingsBtn" title="设置目录" aria-label="设置">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 6.5A3.5 3.5 0 1 0 10 13.5 3.5 3.5 0 0 0 10 6.5zm0 5A1.5 1.5 0 1 1 10 8a1.5 1.5 0 0 1 0 3.5z"/><path d="M8.6 1.5h2.8l.4 2a6.6 6.6 0 0 1 1.5.9l1.9-.8 2 2-.8 1.9c.4.5.7 1 .9 1.5l2 .4v2.8l-2 .4a6.6 6.6 0 0 1-.9 1.5l.8 1.9-2 2-1.9-.8a6.6 6.6 0 0 1-1.5.9l-.4 2H8.6l-.4-2a6.6 6.6 0 0 1-1.5-.9l-1.9.8-2-2 .8-1.9a6.6 6.6 0 0 1-.9-1.5l-2-.4v-2.8l2-.4c.2-.5.5-1 .9-1.5l-.8-1.9 2-2 1.9.8c.5-.4 1-.7 1.5-.9z"/></svg>
    </button>
  </div>
</header>

<!-- ── 列表模式 ───────────────────────────────────────────────────────── -->
<div class="browse" id="browsePane">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span>目录</span>
      <button type="button" class="link-btn" id="collapseSidebar" title="收起目录 (B)">收起</button>
    </div>
    <nav class="tree" id="tree" aria-label="目录树"></nav>
    <div class="sidebar-foot">
      <button type="button" class="ghost-btn" id="feedAllBtn" title="把当前目录下的所有图片和视频做成连续播放列表">
        ▶ 全部连播
      </button>
    </div>
    <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" aria-label="调整目录栏宽度" title="拖动调整目录栏宽度，双击恢复默认"></div>
  </aside>
  <!-- 目录栏收起来之后留一条可点的细栏，否则「怎么把目录弄回来」没有出口。 -->
  <button type="button" class="sidebar-rail" id="sidebarRail" title="展开目录栏 (B)" aria-label="展开目录栏">
    <span class="rail-icon">☰</span>
    <span class="rail-text">目录</span>
  </button>

  <main class="content" id="content">
    <section class="toolbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="toolbar-side">
        <div class="modes modes-sm" role="group" aria-label="浏览范围">
          <button type="button" class="mode-btn is-active" data-scope-btn="dir" title="只看当前这一层">本目录</button>
          <button type="button" class="mode-btn" data-scope-btn="all" title="递归列出所有层级的文件，不显示文件夹">全部（含子目录）</button>
        </div>
        <div class="modes modes-sm" role="group" aria-label="列出内容">
          <button type="button" class="mode-btn" data-kind-btn="all" title="图片和视频都显示">全部</button>
          <button type="button" class="mode-btn is-active" data-kind-btn="video" title="只显示视频">只看视频</button>
        </div>
        <div class="modes modes-sm" role="group" aria-label="分组方式">
          <button type="button" class="mode-btn is-active" data-group-btn="flat" title="文件直接平铺，不分组">平铺</button>
          <button type="button" class="mode-btn" data-group-btn="folder" title="每个子文件夹包成一张卡片，卡片内部仍然平铺">按文件夹分组</button>
        </div>
      </div>
    </section>

    <div class="summary" id="summary"></div>
    <section class="folders-grid" id="folders" aria-label="子文件夹"></section>
    <section class="grid" id="grid" aria-label="媒体"></section>
    <div class="more" id="more"></div>
    <div class="empty" id="empty" hidden>
      <p class="empty-title">这个目录里没有图片或视频</p>
      <p class="empty-hint">换一个目录，或在设置里添加一个媒体目录。</p>
      <button type="button" class="primary-btn" data-open-settings>打开设置</button>
    </div>
  </main>
</div>

<!-- ── 刷视频模式 ─────────────────────────────────────────────────────── -->
<div class="feed" id="feedPane" hidden>
  <div class="feed-scroller" id="feedScroller" tabindex="0" aria-label="连续播放"></div>
  <div class="feed-empty" id="feedEmpty" hidden>
    <p>当前范围没有可播放的内容。</p>
    <button type="button" class="ghost-btn" data-back-browse>返回列表</button>
  </div>
  <div class="feed-hud">
    <div class="feed-hud-left">
      <button type="button" class="chip" id="feedScope" title="切换刷取范围"></button>
      <span class="chip chip-quiet" id="feedProgress">0 / 0</span>
    </div>
    <div class="feed-hud-right">
      <button type="button" class="icon-btn ghost" id="feedMute" title="静音开关 (M)" aria-label="静音">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8h3l4-3v10l-4-3H4z"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5v-5z"/></svg>
      </button>
      <button type="button" class="icon-btn ghost" id="feedMore" title="重新载入列表" aria-label="重新载入">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 6.7 9h-2.1A5 5 0 1 1 10 5v2.5L14 4l-4-3.5z"/></svg>
      </button>
      <button type="button" class="icon-btn ghost" id="feedExit" title="返回列表 (Esc)" aria-label="返回列表">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4h2v12H6zM9 10l6-5v10z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ── 图片查看器 ─────────────────────────────────────────────────────── -->
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="图片查看">
  <div class="viewer-stage" id="viewerStage">
    <img id="viewerImage" alt="">
  </div>
  <div class="viewer-bar">
    <div class="viewer-meta" id="viewerMeta"></div>
    <div class="viewer-actions">
      <button type="button" class="icon-btn ghost" id="imageZoomOut" title="缩小 (-)">−</button>
      <button type="button" class="icon-btn ghost" id="imageZoomReset" title="适应窗口 (0)">1:1</button>
      <button type="button" class="icon-btn ghost" id="imageZoomIn" title="放大 (+)">+</button>
      <button type="button" class="icon-btn ghost" id="imageDownload" title="下载 (D)">⤓</button>
      <button type="button" class="icon-btn ghost" id="imageClose" title="关闭 (Esc)">✕</button>
    </div>
  </div>
  <button type="button" class="viewer-nav prev" id="imagePrev" aria-label="上一张">‹</button>
  <button type="button" class="viewer-nav next" id="imageNext" aria-label="下一张">›</button>
</div>

<!-- ── 播放器 ─────────────────────────────────────────────────────────── -->
<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="视频播放">
  <video id="video" playsinline preload="metadata" crossorigin="anonymous"></video>
  <div class="player-center" id="playerCenter">
    <button type="button" class="big-btn" id="bigPlay" aria-label="播放/暂停">
      <svg class="icon-play" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 10l22 14-22 14z"/></svg>
      <svg class="icon-pause" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 10h7v28h-7zM27 10h7v28h-7z"/></svg>
    </button>
  </div>
  <div class="player-spinner" id="playerSpinner" hidden><span></span></div>
  <div class="player-toast" id="playerToast" hidden></div>

  <div class="player-chrome" id="playerChrome">
    <div class="player-title">
      <span class="player-name" id="playerName"></span>
      <span class="player-sub" id="playerSub"></span>
    </div>

    <div class="progress" id="progress" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-track">
        <div class="progress-buffer" id="progressBuffer"></div>
        <div class="progress-played" id="progressPlayed"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <div class="progress-tip" id="progressTip" hidden><span id="progressTipTime">0:00</span><img id="progressTipImage" alt="" hidden><video id="progressTipVideo" muted playsinline preload="auto" aria-hidden="true"></video></div>
    </div>

    <div class="controls">
      <button type="button" class="icon-btn ghost" id="btnPlay" title="播放 / 暂停 (空格)" aria-label="播放/暂停">
        <svg class="icon-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z"/></svg>
        <svg class="icon-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h4v12H5zM11 4h4v12h-4z"/></svg>
      </button>
      <button type="button" class="icon-btn ghost" id="btnPrev" title="上一个 (← / ↑)" aria-label="上一个">⏮</button>
      <button type="button" class="icon-btn ghost" id="btnNext" title="下一个 (→ / ↓)" aria-label="下一个">⏭</button>
      <button type="button" class="icon-btn ghost" id="btnBack10" title="后退 10 秒 (J)">↺10</button>
      <button type="button" class="icon-btn ghost" id="btnFwd10" title="前进 10 秒 (L)">10↻</button>

      <div class="volume">
        <button type="button" class="icon-btn ghost" id="btnMute" title="静音 (M)" aria-label="静音">🔊</button>
        <input id="volumeRange" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
      </div>

      <span class="time" id="timeLabel">0:00 / 0:00</span>
      <span class="live-badge" id="statLive" hidden>实时</span>

      <div class="controls-right">
        <span class="stat" id="statBasic"></span>
        <div class="menu-wrap">
          <button type="button" class="icon-btn ghost" id="btnSubtitles" title="字幕 (C)" aria-label="字幕">CC</button>
          <div class="menu" id="subtitleMenu" hidden></div>
        </div>
        <div class="menu-wrap">
          <button type="button" class="icon-btn ghost" id="btnSpeed" title="倍速" aria-label="倍速"><span id="speedLabel">1×</span></button>
          <div class="menu" id="speedMenu" hidden></div>
        </div>
        <button type="button" class="icon-btn ghost" id="btnStats" title="播放统计 (I)" aria-label="播放统计">{ }</button>
        <button type="button" class="icon-btn ghost" id="btnLoop" title="单个循环 (U)" aria-label="循环">⟲</button>
        <button type="button" class="icon-btn ghost" id="btnSnapshot" title="截取当前帧 (P)" aria-label="截图">📷</button>
        <button type="button" class="icon-btn ghost" id="btnPip" title="画中画 (Q)" aria-label="画中画">◳</button>
        <button type="button" class="icon-btn ghost" id="btnFullscreen" title="全屏 (F)" aria-label="全屏">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v2H5v4H3zM11 3h6v6h-2V5h-4zM3 11h2v4h4v2H3zM15 11h2v6h-6v-2h4z"/></svg>
        </button>
        <button type="button" class="icon-btn ghost" id="btnDownload" title="下载 (D)" aria-label="下载">⤓</button>
        <button type="button" class="icon-btn ghost" id="btnClose" title="关闭 (Esc)" aria-label="关闭">✕</button>
      </div>
    </div>
  </div>

  <pre class="stats" id="statsPanel" hidden></pre>
</div>

<!-- ── 设置抽屉 ───────────────────────────────────────────────────────── -->
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="设置">
  <div class="drawer-panel">
    <header class="drawer-head">
      <h2>媒体目录</h2>
      <button type="button" class="icon-btn ghost" id="drawerClose" aria-label="关闭">✕</button>
    </header>

    <p class="drawer-note" id="drawerNote"></p>

    <ol class="root-list" id="rootList"></ol>

    <form class="root-add" id="rootAdd">
      <label for="rootInput">添加目录</label>
      <div class="root-add-row">
        <input id="rootInput" type="text" placeholder="D:\Photos 或 /home/me/Media" spellcheck="false" autocomplete="off">
        <button type="submit" class="primary-btn">添加</button>
      </div>
      <p class="root-error" id="rootError" hidden></p>
    </form>

    <div class="picker">
      <div class="picker-head">
        <button type="button" class="ghost-btn" id="pickerUp" title="上一级">↑ 上一级</button>
        <span class="picker-path" id="pickerPath">选择一个目录</span>
      </div>
      <div class="picker-list" id="pickerList"></div>
    </div>

    <footer class="drawer-foot">
      <span class="drawer-status" id="drawerStatus"></span>
      <button type="button" class="ghost-btn" id="drawerReload">重新载入</button>
    </footer>
  </div>
</div>

<!-- 没有全局加载遮罩：数据慢就慢，画面保持可用。 -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/reel/player.js"></script>
<script src="/reel/app.js"></script>
</body>
</html>
